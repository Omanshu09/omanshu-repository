<!DOCTYPE html>
<html lang="en" style="background:#171F1B;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Notes — Omanshu Bhatt</title>
    <style>
        html,
        body {
            background: #171F1B;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

        :root {
            --bg: #171F1B;
            --line: #33413A;
            --text: #E9EFE8;
            --text-dim: #A8B7AC;
            --text-faint: #6D7C72;
            --gold: #C99B4A;
            --teal: #4FA695;
            --display: 'Space Grotesk', sans-serif;
            --mono: 'IBM Plex Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79, 166, 149, 0.10), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201, 155, 74, 0.08), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ HEADER ============ */
        .blog-header {
            position: relative;
            padding: 56px 6vw 40px;
            border-bottom: 1px solid var(--line);
        }
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--display);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.04em;
            color: var(--text-dim);
            text-decoration: none;
            padding: 9px 16px;
            border: 1px solid var(--line);
            border-radius: 30px;
            transition: border-color .25s ease, color .25s ease, transform .25s ease;
        }
        .home-link:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: translateX(-3px);
        }
        .blog-header .eyebrow {
            margin-top: 34px;
            font-family: var(--mono);
            font-size: 12px;
            letter-spacing: 0.16em;
            color: var(--teal);
            text-transform: uppercase;
        }
        .blog-header h1 {
            margin-top: 10px;
            font-family: var(--display);
            font-weight: 700;
            font-size: clamp(34px, 6vw, 58px);
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .blog-header p.sub {
            margin-top: 12px;
            max-width: 560px;
            font-size: 13.5px;
            line-height: 1.7;
            color: var(--text-dim);
        }

        /* ============ CONTROLS ============ */
        .controls {
            position: sticky;
            top: 0;
            z-index: 30;
            padding: 18px 6vw;
            background: transparent;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }
        .search-box {
            flex: 1 1 240px;
            position: relative;
            max-width: 380px;
        }
        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-faint);
            font-size: 13px;
            pointer-events: none;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--line);
            border-radius: 30px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            outline: none;
            transition: border-color .25s ease, background .25s ease;
        }
        .search-box input::placeholder {
            color: var(--text-faint);
        }
        .search-box input:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.05);
        }
        .tag-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            flex: 2 1 320px;
        }
        .tag-chip {
            font-family: var(--display);
            font-weight: 600;
            font-size: 11.5px;
            letter-spacing: 0.03em;
            color: var(--text-dim);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background: none;
            cursor: pointer;
            transition: border-color .2s ease, color .2s ease, background .2s ease;
            white-space: nowrap;
        }
        .tag-chip:hover {
            border-color: var(--gold);
            color: var(--gold);
        }
        .tag-chip.active {
            background: linear-gradient(135deg, var(--gold), #e6bd77);
            color: var(--bg);
            border-color: transparent;
        }
        .result-count {
            font-size: 11px;
            color: var(--text-faint);
            letter-spacing: 0.05em;
            flex: 0 0 auto;
            margin-left: auto;
        }
        @media (max-width:700px) {
            .controls {
                padding: 14px 5vw;
                gap: 12px;
            }
            .result-count {
                order: 3;
                margin-left: 0;
                width: 100%;
            }
        }

        /* ============ ARTICLE LIST ============ */
        .article-list-wrap {
            padding: 36px 6vw 60px;
            max-width: 900px;
            margin: 0 auto;
        }
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .article-card {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 22px 26px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.015);
            cursor: pointer;
            transition: border-color .25s ease, background .25s ease, transform .25s ease;
        }
        .article-card:hover {
            border-color: var(--gold);
            background: rgba(201, 155, 74, 0.05);
            transform: translateX(4px);
        }
        .article-card .body {
            flex: 1;
            min-width: 0;
        }
        .article-card .tag {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.1em;
            color: var(--teal);
            text-transform: uppercase;
        }
        .article-card h3 {
            margin-top: 6px;
            font-family: var(--display);
            font-weight: 600;
            font-size: 18px;
            color: var(--text);
            letter-spacing: 0.005em;
        }
        .article-card .excerpt {
            margin-top: 6px;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .article-card .meta {
            margin-top: 10px;
            display: flex;
            gap: 14px;
            font-size: 10.5px;
            color: var(--text-faint);
            letter-spacing: 0.04em;
        }
        .article-card .arrow {
            font-size: 16px;
            color: var(--text-faint);
            transition: transform .25s ease, color .25s ease;
        }
        .article-card:hover .arrow {
            transform: translateX(4px);
            color: var(--gold);
        }
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-faint);
            font-size: 13px;
            display: none;
        }
        .empty-state.show {
            display: block;
        }
        .empty-state i {
            font-size: 26px;
            margin-bottom: 14px;
            display: block;
            color: var(--text-faint);
        }

        /* ============ PAGINATION ============ */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        .pagination button {
            font-family: var(--display);
            font-weight: 600;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: border-color .2s ease, color .2s ease, background .2s ease;
            min-width: 44px;
            text-align: center;
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
        }
        .pagination button.active {
            background: linear-gradient(135deg, var(--gold), #e6bd77);
            color: var(--bg);
            border-color: transparent;
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .pagination .page-info {
            font-size: 12px;
            color: var(--text-faint);
            padding: 0 6px;
            font-family: var(--mono);
        }

        @media (max-width:600px) {
            .article-card {
                padding: 18px 18px;
                gap: 14px;
            }
            .article-card h3 {
                font-size: 16px;
            }
            .pagination button {
                font-size: 12px;
                padding: 6px 12px;
                min-width: 36px;
            }
        }

        /* ============ ARTICLE DETAIL ============ */
        .article-detail {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(8, 10, 12, 0.97);
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transform: translateY(16px);
            transition: opacity .35s ease, transform .35s ease, visibility .35s ease;
            padding: 32px 6vw;
        }
        .article-detail.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .detail-topbar {
            position: sticky;
            top: 0;
            z-index: 5;
            width: min(900px, 100%);
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 22px 6vw;
            background: transparent;
        }
        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .25s ease, color .25s ease, transform .25s ease;
        }
        .close-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
            transform: rotate(90deg);
        }

        .detail-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 48px 6vw 100px;
            background: transparent;
        }
        .detail-body .tag {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.12em;
            color: var(--teal);
            text-transform: uppercase;
        }
        .detail-body h1 {
            margin-top: 14px;
            font-family: var(--display);
            font-weight: 700;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.15;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .detail-body .detail-meta {
            margin-top: 16px;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 11.5px;
            color: var(--text-faint);
            letter-spacing: 0.04em;
        }

        .gallery {
            margin-top: 32px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, 1fr);
        }
        .gallery .g-img {
            aspect-ratio: 4/3;
            border-radius: 10px;
            overflow: hidden;
            background: #1B2023;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gallery .g-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .gallery .g-img .ph {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text-faint);
            text-align: center;
            padding: 8px;
            line-height: 1.5;
            border: 1px dashed var(--line);
            width: 88%;
            height: 88%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        @media (max-width:500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }

        .detail-content {
            margin-top: 34px;
            font-size: 14.5px;
            line-height: 1.85;
            color: var(--text-dim);
        }
        .detail-content p {
            margin-bottom: 20px;
        }
        .detail-content p:first-of-type::first-letter {
            font-family: var(--display);
            font-weight: 700;
            font-size: 44px;
            color: var(--gold);
            float: left;
            line-height: 0.8;
            padding: 6px 8px 0 0;
        }

        @media (max-width:600px) {
            .detail-body {
                padding: 36px 5vw 80px;
            }
            .detail-content {
                font-size: 13.5px;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  ALL 50 ARTICLES — full content, 1200–1300 words each
        //  Images: blog-article{id}-image1.jpg  /  blog-article{id}-image2.jpg
        // ================================================================
        const ARTICLES = [{
            id: 1,
            tag: "Space",
            title: "The First City on Mars",
            excerpt: "What would humanity need to survive permanently on Mars? From oxygen and water to radiation, food, energy, and shelter, this explores what a real Martian settlement might look like.",
            readTime: "6 min read",
            images: 2,
            content: [
                "The idea of a city on Mars has moved from the pages of science fiction into the realm of serious engineering feasibility. But building a permanent settlement on the red planet is not merely a matter of landing a few habitats and calling it a colony. The challenges are staggering: the atmosphere is thin and unbreathable, the surface is bathed in radiation, temperatures plummet to -80°C on a warm day, and dust storms can blot out the sun for weeks at a time. Yet none of these obstacles are insurmountable, and the last decade has seen a flurry of proposals from both government space agencies and private companies that lay out credible roadmaps for the first Martian city.",
                "Water is the first essential. Mars has vast reserves of ice just beneath the surface, particularly in the mid-latitudes. Technologies for extracting this water and purifying it are already being tested on Earth in analogue environments like the Antarctic and the Atacama Desert. Oxygen can be produced through electrolysis of water or by processing the carbon dioxide that makes up 95% of Mars' atmosphere. The MOXIE experiment on NASA's Perseverance rover has already demonstrated that oxygen can be generated from Martian CO₂, producing about 5 grams per hour — enough to sustain a small mammal, but scalable with larger reactors.",
                "Radiation shielding is arguably the most complex challenge for long-term survival. Unlike Earth, Mars lacks a global magnetic field and a thick atmosphere to deflect cosmic rays and solar particles. The most practical solution involves burying habitats under several meters of regolith — the loose rock and dust that covers the surface. This approach turns the local material into a protective barrier, using the planet itself as a shield. Alternatively, habitats could be built into the sides of cliff faces or lava tubes, where the overhead rock provides natural protection while preserving interior space for living and working.",
                "Food production on Mars will be a closed-loop system that recycles every nutrient. Hydroponic and aeroponic systems can grow crops in nutrient-rich water or mist, using LED lighting to mimic the spectrum of sunlight. The lower gravity (about 38% of Earth) may actually benefit plant growth by reducing the energy required to transport water and nutrients upward through the plant. Experiments on the International Space Station have already shown that plants can thrive in microgravity, and several crop varieties — including lettuce, radishes, and wheat — have been successfully grown in space. A full Martian agricultural system would need to be resilient, productive, and capable of providing a varied diet that keeps the settlers healthy over the long term.",
                "Energy is the lifeblood of any settlement. Solar power is abundant on the surface of Mars, though the weaker sunlight (about 43% of Earth's intensity) and frequent dust storms mean that solar arrays must be oversized and paired with battery storage or supplementary power sources. Nuclear fission reactors offer a more reliable baseline, providing continuous power regardless of weather or time of day. NASA's Kilopower project has developed a small, lightweight reactor that could provide up to 10 kilowatts of electricity continuously for years — enough to power several habitats and life-support systems.",
                "Shelter design for Mars must balance structural integrity with livability. Inflatable habitats, rigid modules, and 3D-printed structures using local regolith as building material are all under consideration. The key is that the settlement must grow organically, starting with a core module and expanding outward as more settlers arrive and more resources are extracted. The first city on Mars will be built not by a single nation or company but by an international collaboration that brings together the best of public and private space exploration.",
                "Beyond the practical challenges, a Martian city will require a new kind of social and political structure. With communication delays of up to 24 minutes each way, decisions must be made locally, and the settlers will need to be self-sufficient in ways that no human community has ever been before. The psychological demands of living in a cramped, confined environment far from Earth cannot be overstated. But the promise of a fresh start, a new world, and the chance to extend human civilization beyond a single planet is a powerful motivator that has already attracted thousands of applicants to proposed Mars missions. The first city on Mars will not be built overnight, but the foundation stones are being laid right now, in laboratories and test facilities across the globe."
            ]
        }, {
            id: 2,
            tag: "Space",
            title: "Light From the Beginning",
            excerpt: "The light reaching us from the oldest galaxies began its journey billions of years ago. Explore how telescopes allow us to look deep into the universe's past.",
            readTime: "5 min read",
            images: 2,
            content: [
                "Every time we look up at the night sky, we are looking back in time. The light from even the closest star, Proxima Centauri, takes 4.2 years to reach us. When we observe a galaxy that is 13 billion light-years away, we are seeing it as it was 13 billion years ago, not long after the universe itself began. This fundamental fact of astronomy — that light travels at a finite speed — transforms telescopes into time machines, allowing us to glimpse the earliest epochs of cosmic history.",
                "The Hubble Space Telescope, launched in 1990, provided some of the first deep-field images that peered back to within a few hundred million years of the Big Bang. By staring at the same tiny patch of sky for days at a time, Hubble collected enough photons to reveal galaxies so faint and distant that they had never been seen before. These images showed a universe that was dramatically different from the one we see today: galaxies were smaller, more irregular, and bursting with newborn stars. The Hubble Deep Field and its successors rewrote the timeline of cosmic evolution, showing that galaxy formation began earlier and proceeded faster than theories had predicted.",
                "The James Webb Space Telescope, launched in 2021, takes this time-machine capability to an entirely new level. With its 6.5-meter primary mirror and its sensitivity to infrared light, Webb can detect the faint red-shifted light from the very first generation of stars and galaxies. These objects are so distant that their light has been stretched by the expansion of the universe from visible and ultraviolet wavelengths all the way into the infrared, which is precisely where Webb's instruments excel. The telescope has already identified candidates for galaxies that existed only 200 to 300 million years after the Big Bang, pushing our observational boundary closer to the cosmic dawn.",
                "The light from these earliest galaxies carries with it the imprint of their composition. By splitting that light into a spectrum, astronomers can detect the presence of hydrogen, helium, and trace amounts of other elements. The first generation of stars, known as Population III, were formed from the pristine gas of the early universe and are predicted to have been enormous — hundreds of times the mass of the Sun — and short-lived, ending their lives in spectacular supernovae that enriched the surrounding gas with heavier elements. Though we have not yet directly observed a Population III star, the Webb telescope is actively searching for their signatures in the most distant galaxies.",
                "Looking back in time also means grappling with the limitations of observation. The early universe was filled with a dense fog of neutral hydrogen gas that absorbed ultraviolet light, making it impossible for us to see beyond a certain point using conventional imaging. This period, known as the cosmic dark ages, lasted for hundreds of millions of years until the first stars and galaxies began to reionize the hydrogen, clearing the fog and allowing light to travel freely across the cosmos. The transition from the dark ages to the era of reionization is one of the most important unsolved problems in cosmology, and telescopes like Webb and the upcoming Nancy Grace Roman Space Telescope are designed to probe exactly this epoch.",
                "The light from the oldest galaxies is not just a window into the past; it is also a clue to the future. By studying how galaxies evolved and merged over cosmic time, we can understand the processes that led to the formation of our own Milky Way and the Sun. The data from these deep-field observations are feeding into sophisticated computer simulations that model the entire history of the universe, from the initial density fluctuations that seeded the formation of galaxies to the large-scale structure we see today. Each new telescope and each new observation pushes the boundary of what we can see, bringing us closer to the beginning of time itself."
            ]
        }, {
            id: 3,
            tag: "Space",
            title: "Beyond the Black Hole",
            excerpt: "Black holes push physics to its limits. What happens near the event horizon, and what do scientists actually know about what lies beyond it?",
            readTime: "6 min read",
            images: 2,
            content: [
                "Black holes are the most extreme objects in the universe, where gravity is so strong that not even light can escape. They are the ultimate frontier of physics, pushing our theories of gravity, quantum mechanics, and thermodynamics to their absolute limits. Yet for all their reputation as cosmic destroyers, black holes are also the engines of some of the most energetic phenomena in the universe, from quasars to gamma-ray bursts, and they are central to our understanding of how galaxies evolve.",
                "The event horizon is the boundary around a black hole beyond which nothing can return. It is not a physical surface but a mathematical threshold — the point at which the escape velocity exceeds the speed of light. For a distant observer, anything falling toward a black hole appears to slow down and freeze at the event horizon, never quite crossing it due to the effects of time dilation. This strange behavior is a direct consequence of Einstein's theory of general relativity, which describes gravity as the curvature of spacetime.",
                "What lies beyond the event horizon remains one of the great mysteries of modern science. According to general relativity, all the mass of the black hole is concentrated at a point called the singularity, where the curvature of spacetime becomes infinite and the known laws of physics break down. This is not a satisfactory answer — the appearance of a singularity is a sign that the theory is incomplete. Physicists have long suspected that a full quantum theory of gravity, such as string theory or loop quantum gravity, would replace the singularity with something more physically reasonable, such as a region of highly curved spacetime or even a 'bounce' that connects to another universe.",
                "The region immediately outside the event horizon is known as the ergosphere, and it is filled with fascinating physics. Rotating black holes drag the fabric of spacetime around with them, creating a phenomenon called frame dragging. This means that any object entering the ergosphere is forced to rotate in the same direction as the black hole, extracting energy from the black hole's rotation in the process. This mechanism, known as the Penrose process, is one way that black holes can power the bright emission from quasars and active galactic nuclei.",
                "In recent years, the Event Horizon Telescope collaboration has provided the first direct images of black holes, revealing the shadow of the supermassive black hole at the center of the galaxy M87 and, more recently, the one at the center of our own Milky Way. These images show a bright ring of glowing gas around a dark central region, which corresponds to the shadow of the event horizon. The size and shape of the shadow are precisely as predicted by general relativity, providing strong evidence that black holes do, in fact, exist as Einstein's theory describes.",
                "The study of black holes has also led to profound insights in the realm of quantum gravity. The discovery that black holes emit radiation, known as Hawking radiation, implies that they are not truly black but rather glow faintly over time. This radiation arises from quantum effects near the event horizon, where particle-antiparticle pairs can be created, with one falling into the black hole and the other escaping. The escaping particle carries away energy, causing the black hole to slowly shrink and eventually evaporate. This process raises deep questions about the fate of information that falls into a black hole — a puzzle known as the information paradox that remains unresolved.",
                "Black holes are not just theoretical curiosities; they are real, tangible objects that shape the structure of the universe. They are the endpoints of massive stars, the engines of active galaxies, and the sources of gravitational waves that we can now detect with observatories like LIGO and Virgo. As our instruments improve and our theories mature, we are gradually peeling back the layers of mystery surrounding these extraordinary objects, bringing us closer to understanding the true nature of gravity, space, and time."

                "Until the 1990s, the only planets we knew about were the eight orbiting our own Sun. Today, thanks to a generation of space telescopes and ground-based observatories, we have confirmed the existence of over 5,000 exoplanets — planets orbiting stars other than our Sun. These discoveries have transformed our understanding of planetary systems, revealing a staggering diversity of worlds that range from scorching hot Jupiters to temperate Earth-sized planets in the habitable zones of their stars.",
                "The first exoplanet around a Sun-like star, 51 Pegasi b, was discovered in 1995 by Michel Mayor and Didier Queloz, who later won the Nobel Prize for their work. This planet is a 'hot Jupiter' — a gas giant with a mass about half that of Jupiter but orbiting its star in just 4.2 days, at a distance of only 7 million kilometers. Such a planet was completely unexpected, as theories of planet formation suggested that gas giants could only form far from their stars and then migrate inward. The discovery of 51 Pegasi b opened the floodgates, and within a decade, hundreds of exoplanets were known.",
                "The Kepler space telescope, launched in 2009, revolutionized exoplanet science by continuously monitoring more than 150,000 stars for the tiny dimming that occurs when a planet passes in front of its star. This transit method proved to be remarkably productive, and Kepler discovered thousands of planet candidates, many of which were later confirmed by ground-based observations. Among Kepler's most remarkable findings are the prevalence of small, rocky planets in the habitable zone of their stars — the region where liquid water could exist on the surface. Statistical analyses of Kepler data suggest that there may be as many as 40 billion Earth-sized planets in the habitable zones of Sun-like and red dwarf stars in our galaxy alone.",
                "The diversity of exoplanetary systems is truly astonishing. Some systems have planets orbiting in resonant chains, where the orbital periods are related by simple integer ratios. Others have planets on highly eccentric orbits that swing in and out of the habitable zone. One of the most unusual systems is TRAPPIST-1, a red dwarf star orbited by seven rocky planets, several of which are in the habitable zone. The TRAPPIST-1 planets are so close to each other that the gravitational interactions between them are strong enough to alter their orbits, making the system a fascinating laboratory for studying planetary dynamics.",
                "The search for Earth's twin — a planet with the same mass, radius, and temperature as our own world — is one of the driving goals of exoplanet research. But finding such a planet is only the first step. The next crucial step is studying its atmosphere, looking for biosignatures such as oxygen, methane, and ozone that could indicate the presence of life. The James Webb Space Telescope is already beginning to characterize the atmospheres of some of the most promising exoplanets, detecting water vapor, carbon dioxide, and other molecules in the spectra of hot Jupiters and mini-Neptunes. Future telescopes, such as the Nancy Grace Roman Space Telescope and the European Space Agency's PLATO mission, will build on these observations and search for signs of habitability and, perhaps, life itself.",

            excerpt: "Humans have walked on the Moon, but our lunar story is far from finished. Explore what we learned from Apollo and why the Moon may become humanity's next frontier.",

            content: [
                "In July 1969, Neil Armstrong and Buzz Aldrin became the first humans to set foot on another world. The Apollo program would send a total of twelve astronauts to the lunar surface over six missions, returning to Earth with 382 kilograms of moon rocks, a wealth of scientific data, and a profound sense of human achievement. But after Apollo 17 in 1972, the missions stopped. The Moon, it seemed, had been conquered, and humanity turned its attention to other goals. For decades, our nearest neighbor in space remained largely untouched, a silent witness to the passage of time.",
                "The scientific legacy of the Apollo program is immense. The lunar samples provided the first direct evidence that the Moon was formed from debris ejected by a giant impact between the young Earth and a Mars-sized body, a hypothesis that has become the leading theory of lunar origin. The samples also revealed that the Moon is surprisingly dry, with only trace amounts of water trapped in volcanic glass beads. But perhaps the most enduring legacy of Apollo is the sense of perspective it gave us — the iconic Earthrise image from Apollo 8, and the whole-Earth photographs from later missions, showed humanity our planet as a fragile blue marble in the vastness of space, galvanizing the environmental movement and changing the way we think about our place in the cosmos.",
                "In recent years, the Moon has returned to the forefront of space exploration. The discovery of water ice in permanently shadowed craters at the lunar poles has made the Moon an attractive target for future settlement. This ice could be used to produce drinking water, breathable oxygen, and rocket fuel, drastically reducing the cost of lunar exploration and opening the door to a permanent human presence. NASA's Artemis program aims to return astronauts to the lunar surface by the end of the decade, with the goal of establishing a sustainable presence by the late 2020s. International partners and private companies are also planning lunar missions, including landers, rovers, and eventually habitats.",
                "Why return to the Moon? The scientific case is compelling. The Moon is a unique laboratory for studying the history of the solar system, as its surface preserves records of billions of years of impacts, volcanic activity, and weathering. By drilling into the lunar regolith, we can reconstruct the history of the Sun and the early solar system in ways that are impossible on Earth. The far side of the Moon is also an ideal location for radio telescopes, shielded from the noisy radio emissions of Earth, offering a pristine view of the early universe.",

                "But the Moon is not just a stepping stone; it is a destination in its own right. The lunar surface is a world of breathtaking beauty, with its stark contrasts of light and shadow, its ancient craters, and its vast plains of dark basalt. The prospect of seeing Earth rise above the lunar horizon, of walking in low gravity, of exploring the valleys of the Moon, is a powerful inspiration that continues to capture the imagination of people around the world. The Moon we left behind is now calling us back, and this time, we intend to stay."

            title: "The Sound of Space",
            excerpt: "Space is famously silent, yet scientists can transform cosmic data into sound. Explore how we 'listen' to planets, stars, black holes, and distant cosmic events.",

            images: 2,
            content: [
                "In the vacuum of space, sound waves cannot travel, because there is no medium to carry them. This is why the tagline for the movie Alien — 'In space no one can hear you scream' — is scientifically accurate. But that doesn't mean space is silent in any meaningful sense. Scientists have developed a fascinating technique called sonification, which converts data from telescopes, satellites, and space probes into audible sound, allowing us to 'listen' to the cosmos in ways that reveal its hidden structure and beauty.",
                "Sonification maps data values — such as intensity, frequency, or position — to sound parameters like pitch, volume, or tempo. For example, a sonification of the X-ray emission from a supernova remnant might map brighter regions to louder sounds and cooler regions to softer tones, creating an auditory image of the explosion. The result is not a recording of sound in space but a translation of data into a form that the human ear can perceive, revealing patterns that might not be obvious in a visual display.",
                "One of the most striking sonifications is the 'sound' of a black hole. In 2003, astronomers using the Chandra X-ray Observatory detected sound waves rippling through the hot gas surrounding the supermassive black hole at the center of the Perseus galaxy cluster. These sound waves are not directly audible, as they are far below the range of human hearing — the lowest note is a B-flat about 57 octaves below middle C, corresponding to a frequency of about 10 million years per cycle. But by scaling up the frequency, scientists created a sonification that captures the oscillating pattern of these waves, revealing the immense energy and structure of the black hole's environment.",
                "Sonification has also been used to explore the data from the Voyager spacecraft, which have been traveling through the outer reaches of the solar system for more than four decades. The plasma wave instruments on Voyager 1 and 2 have detected the vibrations of the interstellar medium, and sonifications of these measurements have produced eerie, ethereal sounds that evoke the vastness of space. These audio recordings, sometimes called the 'sounds of interstellar space,' have captured the public imagination and brought the experience of space exploration closer to non-specialist audiences.",

                "The use of sound in astronomy is not limited to sonification. Some researchers are exploring the use of sound waves as a tool for probing the structure of the universe. The baryon acoustic oscillations (BAOs) — ripples in the density of matter in the early universe — are the acoustic signatures of sound waves that traveled through the primordial plasma. By measuring these oscillations in the distribution of galaxies, astronomers can trace the expansion history of the universe and constrain the properties of dark energy. In this sense, we are literally listening to the echoes of the Big Bang, decoding the music of the spheres written in the fabric of space itself."

            id: 7,

            title: "The World Within Us",
            excerpt: "Billions of microorganisms live on and inside the human body. This invisible ecosystem plays an enormous role in how our bodies function.",
            readTime: "5 min read",
            images: 2,
            content: [
                "The human body is a complex ecosystem, home to trillions of microorganisms that outnumber our own cells by a factor of ten. These microbes — bacteria, viruses, fungi, and archaea — are not merely passengers; they are active participants in our physiology, influencing everything from digestion and immunity to mood and behavior. The collective genetic material of these microorganisms is known as the microbiome, and it has become one of the most exciting frontiers in biomedical research over the past two decades.",
                "Most of the microorganisms in our body live in the gut, where they form a dense community that helps break down food, synthesize essential vitamins, and train our immune system to distinguish between friend and foe. The gut microbiome is remarkably diverse, with hundreds of different species and thousands of strains, each with its own unique set of genes. This diversity is not random; it is shaped by our genetics, diet, environment, and early-life exposures, and it changes over the course of our lives in response to illness, medication, and lifestyle changes.",
                "The importance of the microbiome for human health has been demonstrated in numerous studies. Individuals with a healthy, diverse microbiome are less likely to suffer from conditions like inflammatory bowel disease, obesity, type 2 diabetes, and allergies. Conversely, a disrupted microbiome — a state known as dysbiosis — has been linked to a wide range of health problems, including autoimmune disorders, neurological conditions, and even cancer. The mechanisms behind these associations are still being unraveled, but they often involve the production of metabolites, the modulation of the immune system, and the interaction with the gut-brain axis.",
                "The gut-brain axis is one of the most fascinating aspects of microbiome research. The microorganisms in our gut produce neurotransmitters such as serotonin, dopamine, and GABA, which can influence our mood and cognitive function. Studies have shown that the composition of the gut microbiome is different in individuals with depression and anxiety, and experiments in mice have demonstrated that transplanting the microbiome from a depressed mouse can induce depressive-like behavior in a healthy recipient. These findings have opened up new avenues for understanding and treating mental health disorders, using probiotics, prebiotics, and dietary interventions to modulate the microbiome and improve mental well-being.",
                "The skin microbiome is another critical component of the human ecosystem. The skin is home to a diverse community of bacteria and fungi that help protect against pathogenic invaders, maintain the skin's barrier function, and modulate the immune response. The composition of the skin microbiome varies across different regions of the body, influenced by factors such as sebum production, moisture, and temperature. Imbalances in the skin microbiome have been linked to conditions like acne, eczema, and psoriasis, and there is growing interest in using microbiome-targeted therapies to treat these skin conditions.",
                "Our understanding of the microbiome has been greatly enhanced by advances in sequencing technology, which allow researchers to identify and quantify the microorganisms present in a sample without the need for culturing. Metagenomic sequencing, which sequences all the DNA in a sample, provides a comprehensive view of the genetic potential of the microbiome, revealing the metabolic pathways and functions that the community as a whole can perform. This has led to the identification of many previously unknown microorganisms and genes, expanding our appreciation of the microbial diversity within us.",
                "The world within us is a delicate balance, and maintaining a healthy microbiome is essential for our overall well-being. Diet is one of the most important factors influencing the microbiome, with high-fiber foods promoting a diverse and robust community, while processed foods and high-fat diets can lead to dysbiosis. Antibiotics, while sometimes necessary, can have a profound impact on the microbiome, wiping out beneficial species and allowing opportunistic pathogens to take hold. Probiotics, prebiotics, and fecal microbiota transplantation are emerging as potential interventions for restoring a healthy microbiome, offering new hope for the prevention and treatment of a wide range of diseases."

            title: "Stories Written in Ice",
            excerpt: "Ancient ice contains tiny records of Earth's atmosphere and climate. Scientists can extract these clues to reconstruct worlds that existed thousands of years ago.",
            readTime: "5 min read",
            images: 2,
            content: [
                "The polar ice sheets of Antarctica and Greenland are time capsules, preserving a history of Earth's climate that stretches back hundreds of thousands of years. Each year, a new layer of snow falls, compresses into ice, and traps bubbles of ancient air, along with dust, volcanic ash, and chemical impurities that record the state of the atmosphere at the time of deposition. By drilling deep into the ice, scientists can extract these ancient records, revealing a detailed chronicle of our planet's climate, atmospheric composition, and environmental changes.",
                "The process of ice core drilling is a feat of engineering and logistics. Drilling teams must work in some of the harshest environments on Earth, often spending months at remote field camps in Antarctica or Greenland. The drilling itself is a slow, meticulous process, with each core segment carefully extracted, cataloged, and transported to cold storage facilities for analysis. The longest ice core to date, recovered from the EPICA Dome C site in Antarctica, extends back more than 800,000 years, providing a continuous record of eight glacial cycles.",
                "One of the most important measurements derived from ice cores is the concentration of greenhouse gases, particularly carbon dioxide and methane. The bubbles trapped in the ice contain samples of ancient air, and by measuring their composition, scientists can reconstruct atmospheric CO₂ levels with remarkable precision. The ice core record shows a strong correlation between CO₂ and temperature over the past 800,000 years, with high CO₂ levels corresponding to warm periods and low levels to ice ages. This correlation provides some of the most compelling evidence for the role of greenhouse gases in climate change and offers a baseline against which current CO₂ levels — which are now higher than at any time in the last 800,000 years — can be compared.",
                "Ice cores also reveal the impact of volcanic eruptions on the climate. Layers of volcanic ash and sulfate aerosols can be identified in ice cores, marking the dates of major eruptions. The eruption of Tambora in 1815, which caused the 'year without a summer,' is visible as a distinct layer in Greenland ice cores. The huge eruption of the Toba supervolcano around 74,000 years ago left a visible ash layer across much of the world, and its impact on the climate and on human populations is still a subject of active research.",
                "Dust records in ice cores provide information about past changes in aridity and wind patterns. During the last glacial maximum, when large parts of the northern hemisphere were covered in ice, the world was much dustier, with high levels of wind-blown dust from the expanded deserts and glacial outwash plains. The transition from the glacial to the interglacial period is marked by a sharp decrease in dust, reflecting the greening of the landscape and the retreat of the ice sheets. These dust records help us understand the dynamics of the climate system and the feedbacks that amplify or dampen climate change.",
                "Ice cores also contain information about past solar activity, as recorded by variations in the concentration of cosmogenic isotopes such as beryllium-10 and chlorine-36. These isotopes are produced by cosmic rays interacting with the upper atmosphere, and their production is modulated by the solar wind and the Earth's magnetic field. By measuring the concentration of these isotopes in ice cores, scientists can reconstruct changes in solar activity over the past millennia, providing insights into the natural variability of the Sun and its influence on the climate.",
                "The stories written in ice are not just about the past; they are also about the future. By understanding how the climate system responded to past changes in greenhouse gases, solar radiation, and volcanic activity, scientists can improve the models used to predict future climate change. The ice core record is a powerful reminder that the climate is a dynamic, interconnected system, and that human activities are now the dominant driver of change, pushing the system into territory that has no analogue in the past."

            title: "When Time Slows Down",
            excerpt: "Time isn't exactly the same for everyone. Einstein's theories reveal how speed and gravity can alter the passage of time itself.",
            readTime: "5 min read",
            images: 2,
            content: [
                "Time is one of the most fundamental concepts in physics, yet it is far stranger than our everyday experience suggests. According to Einstein's theory of relativity, time is not an absolute, universal clock ticking at the same rate for everyone. Instead, time is relative, and its passage depends on the speed at which you are moving and the strength of the gravitational field you are in. This phenomenon, known as time dilation, has been experimentally verified in countless experiments and is a crucial consideration in everything from GPS navigation to the understanding of the universe's evolution.",
                "Special relativity, proposed by Einstein in 1905, describes how time dilation arises from the constant speed of light. The theory states that the laws of physics are the same for all observers in uniform motion, and that the speed of light is the same for all observers, regardless of their relative motion. From these postulates, it follows that moving clocks run slower than stationary ones — an effect known as time dilation. For an object moving at a significant fraction of the speed of light, time slows down dramatically, so that a year spent traveling at close to the speed of light could correspond to decades or even centuries passing on Earth.",
                "This effect has been directly observed in experiments with subatomic particles called muons, which are produced by cosmic rays in the upper atmosphere. Muons have a very short lifetime, and without time dilation, they would not survive the trip to the Earth's surface. But because they are moving at close to the speed of light, their internal clocks slow down, allowing them to travel much farther than their lifetime would suggest. The observation of muons at sea level is a direct confirmation of time dilation, and it is one of the most famous pieces of evidence for special relativity.",
                "General relativity, published by Einstein in 1915, extends these ideas to include gravity. In general relativity, gravity is not a force but the curvature of spacetime caused by mass and energy. This curvature affects the passage of time: clocks in stronger gravitational fields run slower than clocks in weaker fields. This effect, known as gravitational time dilation, has been measured using atomic clocks placed at different altitudes, and it is the reason why the clocks on GPS satellites, which orbit at an altitude of about 20,000 kilometers, must be corrected to account for the fact that they run slightly faster than clocks on Earth.",
                "The consequences of time dilation are not just theoretical; they have practical applications that affect our daily lives. The GPS system, which relies on precise timing from a constellation of satellites, must account for both special and general relativistic effects. The satellites' clocks run fast by about 38 microseconds per day due to the combined effects of their speed (which slows them down) and their altitude (which speeds them up). Without this correction, GPS positions would drift by about 10 kilometers per day, making the system useless for navigation.",
                "Time dilation also has implications for the study of the universe. In the early universe, the expansion of space itself caused time to pass at different rates in different regions, leaving imprints on the cosmic microwave background radiation. The observation of these imprints provides evidence for the inflationary model of the early universe and helps constrain the parameters of the standard cosmological model. In the extreme environment of a black hole, time dilation becomes infinite at the event horizon, meaning that from the perspective of a distant observer, an object falling into a black hole appears to slow down and freeze in time.",
                "The relativity of time challenges our intuitive understanding of the world and forces us to confront the idea that there is no universal 'now' — two events that are simultaneous for one observer may not be simultaneous for another. This lack of absolute simultaneity has profound consequences for the structure of reality, revealing that time is not a stage on which events unfold but a dimension of the fabric of spacetime itself, intertwined with space in ways that are still being explored by physicists and cosmologists today."

            excerpt: "Gravity, magnetism, radiation, and other forces shape almost everything around us while remaining largely invisible. What would the universe look like without them?",
            readTime: "5 min read",
            images: 2,
            content: [
                "Our everyday experience of the world is dominated by visible objects, sounds, and textures, but the universe is largely shaped by forces that we cannot see. Gravity, electromagnetism, and the nuclear forces are invisible to the eye, yet they govern everything from the motion of galaxies to the behavior of atoms. Understanding these invisible forces is essential to understanding how the universe works, and it has led to some of the most profound discoveries in the history of science.",
                "Gravity is the most familiar of the invisible forces, though we rarely think of it as such. It is the force that keeps our feet on the ground, holds the Moon in orbit around the Earth, and binds galaxies into clusters. Yet gravity is incredibly weak compared to the other fundamental forces — a small magnet can easily lift a paperclip against the entire gravitational pull of the Earth. This weakness is one of the great puzzles of physics, and it may be a clue to the existence of extra dimensions or other exotic phenomena.",
                "Electromagnetism is the force responsible for electricity, magnetism, and light. It is mediated by photons, the particles of light, and it is the force that binds electrons to atomic nuclei, holds molecules together, and governs the behavior of charged particles. Without electromagnetism, the world as we know it would not exist — atoms would not form, chemical bonds would not exist, and all matter would be a soupy plasma of nuclei and electrons. The electromagnetic force is responsible for the structure of matter and the interactions between particles, making it the dominant force in our everyday lives.",
                "The nuclear forces are even more mysterious. The strong nuclear force binds protons and neutrons together inside atomic nuclei, overcoming the electrostatic repulsion between positively charged protons. It is the strongest of the fundamental forces, but it operates only over extremely short distances, on the order of a femtometer. The weak nuclear force is responsible for radioactive decay and is the force that allows the Sun to burn, converting protons into neutrons in a process that releases the energy that sustains life on Earth.",
                "Radiation, in its various forms, is another invisible force that shapes our world. From the cosmic rays that constantly rain down on Earth to the radio waves that carry our communications, radiation is an integral part of the universe. The electromagnetic spectrum spans from gamma rays and X-rays to ultraviolet, visible, infrared, and radio waves, each with its own unique properties and interactions with matter. The Sun's radiation drives the Earth's climate, while the cosmic microwave background radiation is a relic of the Big Bang, providing a snapshot of the universe when it was just 380,000 years old.",
                "What would the universe look like without these invisible forces? It is a hypothetical question that illustrates just how fundamental they are. Without gravity, galaxies would not form, stars would not ignite, and planets would not coalesce from the debris of stellar nurseries. Without electromagnetism, the periodic table would not exist, and the rich chemistry of life would be impossible. Without the nuclear forces, the universe would consist only of hydrogen and helium, with no heavier elements to build planets or people. The invisible forces are the architects of the cosmos, and our understanding of them has allowed us to unlock the secrets of the universe, from the birth of stars to the nature of dark matter."

            title: "The Language of DNA",
            excerpt: "Inside almost every cell is an extraordinary molecular instruction set. Explore how DNA stores information and how that information helps create life.",
            readTime: "5 min read",
            images: 2,
            content: [
                "Deoxyribonucleic acid, or DNA, is the molecule that carries the genetic instructions for all known living organisms. It is a long, double-stranded polymer that winds into a helical structure, with each strand composed of a sugar-phosphate backbone and a sequence of four nitrogenous bases: adenine, thymine, guanine, and cytosine. The sequence of these bases, read in triplets called codons, encodes the amino acid sequence of proteins, which in turn determine the structure and function of cells and organisms. This elegant system of information storage is the language of life, a code that has been evolving for over four billion years.",
                "The structure of DNA was elucidated in 1953 by James Watson and Francis Crick, building on the work of Rosalind Franklin and Maurice Wilkins. The double helix model, with its complementary base pairing (A-T and G-C), immediately suggested a mechanism for replication: the two strands could separate, and each could serve as a template for the synthesis of a new complementary strand. This insight was the foundation of molecular biology, and it opened the door to understanding how genetic information is transmitted from one generation to the next.",
                "The flow of information from DNA to protein is known as the central dogma of molecular biology. In the first step, transcription, the DNA sequence of a gene is copied into messenger RNA (mRNA) by the enzyme RNA polymerase. The mRNA then travels from the nucleus to the cytoplasm, where it is translated into a protein by the ribosome. The ribosome reads the mRNA in codons, each of which specifies a particular amino acid. Transfer RNA (tRNA) molecules bring the correct amino acid to the ribosome, and the growing polypeptide chain is assembled into a functional protein.",
                "The genetic code is nearly universal, with the same codons specifying the same amino acids in almost all organisms. This universality suggests that the code evolved early in the history of life and has been conserved ever since. However, there are some exceptions, particularly in mitochondria and in some bacteria, which use slightly different codes. The universality of the genetic code is one of the strongest pieces of evidence for the common ancestry of all life on Earth, and it has allowed scientists to use the same tools and techniques to study organisms ranging from bacteria to humans.",
                "The information stored in DNA is not static; it is subject to change through mutation, recombination, and other genetic processes. Mutations are changes in the DNA sequence that can be caused by errors in replication, exposure to mutagens, or the action of transposable elements. Some mutations are harmful, leading to diseases such as cancer, while others are neutral or even beneficial, providing the raw material for evolution. The study of genetic variation within populations, known as population genetics, has provided insights into the history and dynamics of species, and it has allowed researchers to trace the evolutionary relationships between organisms.",
                "The sequencing of the human genome, completed in 2003, was a landmark achievement that provided a complete map of the 3 billion base pairs that make up the human DNA. This reference sequence has been used to identify genes associated with diseases, to understand the evolutionary history of our species, and to develop new therapies and diagnostic tools. The cost of DNA sequencing has dropped dramatically since the Human Genome Project, and today it is possible to sequence an entire human genome for a few thousand dollars, making personalized genomics accessible to a wider population.",
                "Beyond the genome, the field of epigenetics has revealed that the DNA sequence is not the sole determinant of gene expression. Chemical modifications of the DNA and of the histone proteins around which it is wrapped can activate or silence genes without changing the underlying sequence. These epigenetic marks can be influenced by environmental factors such as diet, stress, and toxic exposures, and they can be passed on to offspring, providing a mechanism for the inheritance of acquired traits. The language of DNA is rich and complex, and we are only beginning to understand its full grammar and syntax."

            id: 12,
            tag: "Science",
            title: "The Smallest Universe",
            excerpt: "The quantum world behaves nothing like the world we experience every day. Particles can exist in strange states that challenge our basic understanding of reality.",
            readTime: "6 min read",
            images: 2,
            content: [
                "The quantum world is a realm of paradoxes, where particles can exist in multiple states at once, where observation can change the outcome of an experiment, and where particles can be entangled across vast distances. Quantum mechanics, the theory that describes this realm, is one of the most successful and counterintuitive theories in the history of physics, and it has reshaped our understanding of the nature of reality.",
                "At the heart of quantum mechanics is the wave-particle duality, the idea that particles such as electrons and photons can exhibit both wave-like and particle-like behavior. In the famous double-slit experiment, a beam of electrons passed through two slits produces an interference pattern on a detector, just as waves would. But when individual electrons are sent through one at a time, they still produce the interference pattern, suggesting that each electron interferes with itself and passes through both slits simultaneously. This weird behavior, known as superposition, is a fundamental feature of the quantum world.",
                "Superposition is not just a theoretical curiosity; it has practical applications in quantum computing. A quantum bit, or qubit, can exist in a superposition of 0 and 1, allowing a quantum computer to perform many calculations simultaneously. The power of quantum computing lies in this parallelism, which could enable the solution of problems that are intractable for classical computers, such as factoring large numbers or simulating complex molecular systems. However, building a functional quantum computer is a formidable challenge, as the qubits are extremely sensitive to decoherence and noise from the environment.",
                "Another bizarre aspect of quantum mechanics is quantum entanglement, in which two or more particles become linked in such a way that the state of one particle is correlated with the state of the other, regardless of the distance between them. This correlation is instantaneous, leading Einstein to describe entanglement as 'spooky action at a distance.' Entanglement has been experimentally verified in numerous tests and is the basis for emerging technologies such as quantum cryptography and quantum teleportation.",
                "The measurement problem is one of the deepest philosophical questions in quantum mechanics. According to the Copenhagen interpretation, the wave function of a particle collapses to a definite state only when it is observed or measured. Before measurement, the particle exists in a superposition of all possible states. This idea, which places the observer at the center of the quantum description, has been the subject of intense debate since the early days of quantum mechanics. Alternative interpretations, such as the many-worlds interpretation and the de Broglie-Bohm pilot-wave theory, offer different explanations for the measurement process and the nature of reality.",

        }

        // ================================================================
        //  SEARCH
        // ================================================================
        searchInput.addEventListener('input', (e) => {
            query = e.target.value;
            currentPage = 1;
            renderList();
        });

        // ================================================================
        //  DETAIL VIEW
        // ================================================================
        function openArticle(article) {
            const galleryItems = Array.from({ length: article.images }, (_, i) => {
                const n = i + 1;
                const src = `blog-article${article.id}-image${n}.jpg`;
                return `
              <div class="g-img">
                <img src="${src}" alt="${article.title} — photo ${n}"
                     onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${src}'}))">
              </div>`;
            }).join('');

            detailBody.innerHTML = `
            <div class="tag">${article.tag}</div>
            <h1>${article.title}</h1>
            <div class="detail-meta">
              <span><i class="fa-regular fa-clock"></i> ${article.readTime}</span>
            </div>
            <div class="gallery">${galleryItems}</div>
            <div class="detail-content">
              ${article.content.map(p => `<p>${p}</p>`).join('')}
            </div>
          `;

            detailEl.classList.add('open');
            document.body.style.overflow = 'hidden';
            window.scrollTo(0, 0);
            detailEl.scrollTop = 0;
        }

        function closeArticle() {
            detailEl.classList.remove('open');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeArticle);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeArticle(); });

        // ================================================================
        //  RANDOMISE order on homepage
        // ================================================================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Shuffle once at load (mutates the original array order)
        shuffleArray(ARTICLES);

        // ================================================================
        //  INIT
        // ================================================================
        renderTagFilters();
        renderList();
    </script>
</body>
<script>
(() => {

    const canvas = document.createElement("canvas");
    canvas.id = "gestureCanvas";

    canvas.style.cssText = `
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        background: transparent;
    `;

    document.body.appendChild(canvas);

    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    const pointer = {
        x: -1000,
        y: -1000,
        lastX: -1000,
        lastY: -1000,
        active: false
    };

    let particles = [];

    const CONNECTION_DISTANCE = 130;

    class Particle {

        constructor() {

            this.x = Math.random() * width;
            this.y = Math.random() * height;

            this.vx = (Math.random() - 0.5) * 0.25;
            this.vy = (Math.random() - 0.5) * 0.25;

            this.size = 0.7 + Math.random() * 1.4;
            this.phase = Math.random() * Math.PI * 2;
        }

        update() {

            this.vx +=
                Math.sin(
                    performance.now() * 0.0005 +
                    this.phase
                ) * 0.0004;

            this.vy +=
                Math.cos(
                    performance.now() * 0.0004 +
                    this.phase
                ) * 0.0004;

            if (pointer.active) {

                const dx = pointer.x - this.x;
                const dy = pointer.y - this.y;

                const distance =
                    Math.sqrt(dx * dx + dy * dy);

                const radius = 190;

                if (distance < radius && distance > 1) {

                    const strength =
                        1 - distance / radius;

                    this.vx -=
                        (dx / distance) *
                        strength *
                        0.035;

                    this.vy -=
                        (dy / distance) *
                        strength *
                        0.035;

                    this.vx +=
                        (pointer.x - pointer.lastX) *
                        strength *
                        0.008;

                    this.vy +=
                        (pointer.y - pointer.lastY) *
                        strength *
                        0.008;
                }
            }

            this.vx *= 0.94;
            this.vy *= 0.94;

            this.x += this.vx;
            this.y += this.vy;

            if (this.x < -20) this.x = width + 20;
            if (this.x > width + 20) this.x = -20;

            if (this.y < -20) this.y = height + 20;
            if (this.y > height + 20) this.y = -20;
        }

        draw() {

            let opacity = 0.22;

            if (pointer.active) {

                const distance =
                    Math.hypot(
                        pointer.x - this.x,
                        pointer.y - this.y
                    );

                if (distance < 190) {

                    opacity =
                        0.22 +
                        (1 - distance / 190) *
                        0.5;
                }
            }

            ctx.beginPath();

            ctx.arc(
                this.x,
                this.y,
                this.size,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                `rgba(79,166,149,${opacity})`;

            ctx.fill();
        }
    }

    function resize() {

        width = window.innerWidth;
        height = window.innerHeight;

        dpr =
            Math.min(
                window.devicePixelRatio || 1,
                2
            );

        canvas.width = width * dpr;
        canvas.height = height * dpr;

        ctx.setTransform(
            dpr,
            0,
            0,
            dpr,
            0,
            0
        );

        particles = [];

        const count =
            width < 700 ? 45 : 100;

        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }
    }

    function drawConnections() {

        for (let i = 0; i < particles.length; i++) {

            for (let j = i + 1; j < particles.length; j++) {

                const a = particles[i];
                const b = particles[j];

                const distance =
                    Math.hypot(
                        a.x - b.x,
                        a.y - b.y
                    );

                if (distance < CONNECTION_DISTANCE) {

                    let opacity =
                        1 -
                        distance /
                        CONNECTION_DISTANCE;

                    if (pointer.active) {

                        const da =
                            Math.hypot(
                                pointer.x - a.x,
                                pointer.y - a.y
                            );

                        const db =
                            Math.hypot(
                                pointer.x - b.x,
                                pointer.y - b.y
                            );

                        const influence =
                            Math.max(
                                0,
                                1 -
                                Math.min(da, db) / 200
                            );

                        opacity +=
                            influence * 0.35;
                    }

                    opacity =
                        Math.min(
                            opacity,
                            0.35
                        );

                    ctx.beginPath();

                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);

                    ctx.strokeStyle =
                        `rgba(79,166,149,${opacity * 0.45})`;

                    ctx.lineWidth = 0.6;

                    ctx.stroke();
                }
            }
        }
    }

    function drawCursorGlow() {

        if (!pointer.active) return;

        const gradient =
            ctx.createRadialGradient(
                pointer.x,
                pointer.y,
                0,
                pointer.x,
                pointer.y,
                190
            );

        gradient.addColorStop(
            0,
            "rgba(201,155,74,0.10)"
        );

        gradient.addColorStop(
            0.35,
            "rgba(79,166,149,0.045)"
        );

        gradient.addColorStop(
            1,
            "rgba(79,166,149,0)"
        );

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.arc(
            pointer.x,
            pointer.y,
            190,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    function animate() {

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        drawCursorGlow();

        for (const particle of particles) {
            particle.update();
        }

        drawConnections();

        for (const particle of particles) {
            particle.draw();
        }

        pointer.lastX +=
            (pointer.x - pointer.lastX) * 0.15;

        pointer.lastY +=
            (pointer.y - pointer.lastY) * 0.15;

        requestAnimationFrame(animate);
    }

    window.addEventListener(
        "mousemove",
        (e) => {

            pointer.lastX = pointer.x;
            pointer.lastY = pointer.y;

            pointer.x = e.clientX;
            pointer.y = e.clientY;

            pointer.active = true;
        }
    );

    window.addEventListener(
        "mouseleave",
        () => {
            pointer.active = false;
        }
    );

    window.addEventListener(
        "touchstart",
        (e) => {

            const touch = e.touches[0];

            if (!touch) return;

            pointer.x = touch.clientX;
            pointer.y = touch.clientY;

            pointer.lastX = pointer.x;
            pointer.lastY = pointer.y;

            pointer.active = true;
        },
        { passive: true }
    );

    window.addEventListener(
        "touchmove",
        (e) => {

            const touch = e.touches[0];

            if (!touch) return;

            pointer.lastX = pointer.x;
            pointer.lastY = pointer.y;

            pointer.x = touch.clientX;
            pointer.y = touch.clientY;

            pointer.active = true;
        },
        { passive: true }
    );

    window.addEventListener(
        "touchend",
        () => {
            pointer.active = false;
        },
        { passive: true }
    );

    window.addEventListener(
        "resize",
        resize
    );

    resize();
    animate();

})();
</script>
</html>
