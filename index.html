<!DOCTYPE html>
<html lang="en" style="background:#171F1B;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omanshu Bhatt</title>
  <!-- inline, non-blocking: paints the dark background instantly, before
       the font-awesome / Google Fonts requests below have a chance to
       delay first paint — this is what removes the white flash on load
       and when navigating back from the globe page. -->
  <style>html,body{background:#171F1B;}</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root{
      --bg:        #171F1B;
      --line:      #33413A;
      --text:      #E9EFE8;
      --text-dim:  #A8B7AC;
      --text-faint:#6D7C72;
      --gold:      #C99B4A;
      --teal:      #4FA695;
      --display: 'Space Grotesk', sans-serif;
      --mono: 'IBM Plex Mono', monospace;

      /* Orbit sizing — tweak these two to resize the whole ring */
      --radius: 250px;
      --img-size: 130px;
      --orbit-duration: 16s;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
  background:
    linear-gradient(rgba(10,16,14,0.36), rgba(10,16,14,0.36)),
    url('background.jpg') center/cover no-repeat fixed;
  color:var(--text);
  font-family:var(--mono);
  height:100vh;
  overflow-x:hidden;
  overflow-y:hidden;
}

#backgroundVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  pointer-events:none;
  background:url('background.jpg') center/cover no-repeat;
}

    /* ============ TOP BAR ============ */
    .topbar{
      position:fixed; top:0; left:0; right:0; z-index:50;
      display:flex; justify-content:space-between; align-items:center;
      padding:28px 5vw;
      pointer-events:none;
    }
    .topbar a, .topbar button{ pointer-events:auto; }
    .topbar .name-link{
      font-family:var(--display); font-weight:700; font-size:38px;
      letter-spacing:0.02em; color:#fff; text-decoration:none;
      display:flex; align-items:center; gap:12px;
      padding:8px 4px 2px; cursor:pointer;
      animation:nameGlow 4.5s ease-in-out infinite;
    }
    @keyframes nameGlow{
      0%,100%{ text-shadow:0 0 18px rgba(201,155,74,0.15); }
      50%{ text-shadow:0 0 34px rgba(201,155,74,0.55), 0 0 60px rgba(201,155,74,0.2); }
    }
    .topbar .name-block{ display:flex; flex-direction:column; }
    .topbar .cta{
      font-family:var(--display); font-weight:600; font-size:16px; letter-spacing:0.04em;
      color:var(--bg); text-decoration:none; margin-top:10px; margin-left:0; align-self:center;
      display:inline-flex; align-items:center; gap:8px;
      padding:12px 22px; border-radius:30px; width:fit-content;
      background:linear-gradient(135deg, var(--gold), #e6bd77);
      animation:ctaGlow 3.2s ease-in-out infinite;
      transition:transform .25s ease, gap .25s ease;
    }
    .topbar .cta:hover{ transform:translateY(-2px) scale(1.03); gap:12px; }
    @keyframes ctaGlow{
      0%,100%{ box-shadow:0 0 16px rgba(201,155,74,0.35), 0 6px 20px rgba(0,0,0,0.35); }
      50%{ box-shadow:0 0 34px rgba(201,155,74,0.75), 0 6px 26px rgba(0,0,0,0.4); }
    }
    .topbar .cta .arrow{ transition:transform .25s ease; font-weight:700; }
    .topbar .cta:hover .arrow{ transform:translateX(3px); }
    .topbar .dot{
      width:9px; height:9px; border-radius:50%; background:var(--gold);
      box-shadow:0 0 8px var(--gold);
      animation:dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse{
      0%,100%{ opacity:0.6; transform:scale(0.85); }
      50%{ opacity:1; transform:scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce){
      .topbar .name-link, .topbar .cta, .topbar .dot{ animation:none; }
    }
    .topbar .tag{ font-size:11px; color:var(--text-faint); letter-spacing:0.08em; }
    @media (max-width:700px){
      .topbar .tag{ display:none; }
      .topbar{
        top:0; left:0; right:0; padding:16px 16px 10px;
        align-items:flex-start; gap:12px;
      }
      .topbar .name-block{
        width:100%;
        display:flex;
        align-items:flex-start;
      }
      .topbar .name-link{
        font-size:26px; line-height:1.1; letter-spacing:0.02em;
      }
      .topbar .cta{
        margin-top:8px; padding:10px 14px; font-size:13px;
      }
    }

    @media (max-width:520px){
      .topbar{
        padding:14px 14px 8px;
      }
      .topbar .name-link{
        font-size:22px;
        gap:8px;
      }
      .topbar .cta{
        font-size:12px; padding:9px 12px;
      }
    }

    /* ============ MODE TOGGLE (Rings / Spiral) ============ */
    .mode-toggle{
      position:fixed; top:28px; left:50%; transform:translateX(-50%); z-index:55;
      display:flex; gap:28px; font-family:var(--display); font-weight:500;
    }
    .mode-toggle button{
      background:none; border:none; cursor:pointer;
      font-family:inherit; font-size:15px; letter-spacing:0.02em;
      color:#fff; padding:4px 2px; position:relative;
      transition:color .3s ease;
    }
    .mode-toggle button::after{
      content:''; position:absolute; left:0; right:100%; bottom:-2px; height:1px;
      background:#fff; transition:right .3s ease;
    }
    .mode-toggle button.active{ color:#fff; }
    .mode-toggle button.active::after{ right:0; }
    .mode-toggle button:hover{ color:#fff; }
    body.lightbox-open .mode-toggle,
    body.lightbox-open #globeLauncher,
    body.lightbox-open #infiniteGameLauncher,
    body.lightbox-open .ask-ai-button,
    body.lightbox-open .feedback-button,
    body.lightbox-open #contactBtn,
    body.lightbox-open #blogBtn{
      opacity:0; visibility:hidden; pointer-events:none;
      transform:translateY(8px);
    }
    @media (max-width:700px){
      .mode-toggle{ top:auto; bottom:122px; left:50%; transform:translateX(-50%); gap:18px; }
      .mode-toggle button{ font-size:14px; }
    }
    @media (max-width:520px){
      .mode-toggle{ bottom:138px; gap:16px; }
      .mode-toggle button{ font-size:13px; }
    }

    /* ============ INTERACTIVE BACKGROUND ============ */
    #bgCanvas{
      position:fixed; inset:0; z-index:0; pointer-events:none;
    }

    /* ============ GLOBE CONNECTOR (sits above the Infinite launcher) ============ */
    #globeLauncher{
      position:fixed; left:24px; bottom:92px; z-index:9997;
      display:flex; align-items:center; gap:10px;
      padding:8px 16px 8px 8px;
      border:1px solid rgba(255,255,255,.14); border-radius:16px;
      background:rgba(10,12,20,.72); color:white; text-decoration:none;
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      box-shadow:0 12px 40px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.08);
      font-family:var(--mono); transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
    }
    #globeLauncher:hover{
      transform:translateY(-4px); background:rgba(25,28,42,.9);
      box-shadow:0 18px 45px rgba(0,0,0,.35), 0 0 25px rgba(120,140,255,.12);
    }
    #globeLauncher .globe-icon{
      width:30px; height:30px; border-radius:50%; overflow:hidden; position:relative;
      box-shadow:inset 0 0 8px rgba(0,0,0,0.6);
    }
    #globeLauncher .globe-icon .band{
      position:absolute; top:0; left:0; width:200%; height:100%;
      background:
        radial-gradient(10px 8px at 10% 35%, rgba(120,150,90,0.9), transparent 70%),
        radial-gradient(12px 9px at 30% 65%, rgba(110,140,85,0.85), transparent 70%),
        radial-gradient(9px 10px at 55% 30%, rgba(130,110,70,0.8), transparent 70%),
        radial-gradient(11px 8px at 75% 60%, rgba(120,150,90,0.85), transparent 70%),
        radial-gradient(10px 8px at 110% 35%, rgba(120,150,90,0.9), transparent 70%),
        radial-gradient(12px 9px at 130% 65%, rgba(110,140,85,0.85), transparent 70%),
        radial-gradient(9px 10px at 155% 30%, rgba(130,110,70,0.8), transparent 70%),
        radial-gradient(11px 8px at 175% 60%, rgba(120,150,90,0.85), transparent 70%),
        linear-gradient(180deg,#1c3a4a,#14293a 45%,#0e1f2c);
      animation:globeDrift 9s linear infinite;
    }
    #globeLauncher .globe-icon .shade{
      position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), transparent 45%),
                radial-gradient(circle at 68% 78%, rgba(0,0,0,0.6), transparent 60%);
    }
    @keyframes globeDrift{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
    #globeLauncher .globe-label{ font-size:13px; font-weight:600; letter-spacing:.2px; }
    @media (max-width:600px){
      #globeLauncher{ left:16px; bottom:84px; padding:7px 12px 7px 7px; }
      #globeLauncher .globe-label{ font-size:12px; }
    }

    @media (max-width:420px){
      #globeLauncher{ bottom:90px; }
      #globeLauncher .globe-icon{ width:24px; height:24px; }
    }

    /* ============ STAGE ============ */
    .stage{
      position:relative; width:100vw; height:100vh;
      display:flex; align-items:center; justify-content:center;
      perspective:1700px;
    }

    /* ---- center emblem: contour/topographic mark, stands in for K95's "road" ---- */
    .emblem{
      position:relative; z-index:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; pointer-events:none;
    }
    .emblem {
    position: relative;
    z-index: 1;
    width: 230px;
    height: 230px;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
  }



    /* ---- orbit ring: true 3D carousel, JS-driven every frame — see script.
      Rings mode = 3 stacked rings all spinning in 3D depth.
      Spiral mode = infinite vertical helix (wraps top<->bottom forever). ---- */
    .orbit-ring{
      position:absolute; top:50%; left:50%; width:0; height:0;
      transform-style:preserve-3d;
    }

    .orbit-item{
      position:absolute; top:0; left:0;
      width:var(--img-size); height:var(--img-size);
      transform-style:preserve-3d;
      /* transform set continuously by JS */
    }

    .orbit-img{
      width:100%; height:100%; border-radius:6px; overflow:hidden;
      background:#212C25; border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 20px 50px rgba(0,0,0,0.45);
    }
    .orbit-img img{
      width:100%; height:100%; object-fit:cover; display:block;
    }
    /* placeholder look — disappears automatically once a real <img> has a src */
    .orbit-img .placeholder-label{
      font-family:var(--mono); font-size:11px; color:var(--text-faint);
      border:1px dashed var(--line); width:90%; height:90%; border-radius:4px;
      display:flex; align-items:center; justify-content:center; text-align:center;
    }

    @media (max-width:900px){
      :root{ --radius:190px; --img-size:88px; }
    }
    @media (max-width:600px){
      :root{ --radius:150px; --img-size:72px; }
      .emblem svg{ width:150px; height:150px; }
      .emblem .initials{ font-size:24px; }
      .stage{ transform:translateY(-42px) scale(1); }
    }

    @media (max-width:420px){
      :root{ --radius:134px; --img-size:66px; }
      .stage{ transform:translateY(-48px) scale(1); }
    }

    .footline{
      position:fixed; bottom:26px; left:5vw; right:5vw; z-index:50;
      display:flex; justify-content:space-between;
      font-size:11px; letter-spacing:0.08em; color:var(--text-faint);
    }

    .scroll-cue{
      display:none !important;
    }

    @media (prefers-reduced-motion: reduce){
      .emblem .pulse{ animation:none; }
    }

    /* ============ LIGHTBOX (tap an image to enlarge) ============ */
    .orbit-img{ cursor:pointer; }

    .lightbox{
      position:fixed; inset:0; z-index:200;
      background:rgba(10,14,12,0.94);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none;
      transition:opacity .35s ease;
    }
    .lightbox.open{ opacity:1; pointer-events:auto; }

    .lightbox-back{
      position:absolute; top:28px; left:5vw; z-index:210;
      background:none; border:none; cursor:pointer;
      font-family:var(--display); font-weight:600; font-size:14px;
      color:var(--text); letter-spacing:0.04em;
      display:flex; align-items:center; gap:8px;
      padding:10px 16px; border:1px solid var(--line); border-radius:30px;
      transition:border-color .25s ease, color .25s ease, transform .25s ease;
    }
    .lightbox-back:hover{ border-color:var(--gold); color:var(--gold); transform:translateX(-3px); }

    .lightbox-content{
      max-width:min(80vw, 900px); max-height:80vh;
      display:flex; align-items:center; justify-content:center;
      transform:scale(0.92); transition:transform .35s ease;
    }
    .lightbox.open .lightbox-content{ transform:scale(1); }
    .lightbox-content img{
      max-width:100%; max-height:80vh; border-radius:8px;
      box-shadow:0 30px 80px rgba(0,0,0,0.5);
    }
    .lightbox-content .lightbox-placeholder{
      width:400px; height:400px; max-width:80vw; max-height:60vh;
      border:1px dashed var(--line); border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-family:var(--mono); font-size:13px; color:var(--text-faint);
      background:#212C25;
    }

    /* ---- lightbox: image + tap-to-download + caption beneath ---- */
    .lightbox-content{
      flex-direction:column;
      gap:16px;
    }
    .lightbox-media{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      max-width:100%;
    }
    .lightbox-media img{
      max-width:100%; max-height:70vh; border-radius:8px;
      box-shadow:0 30px 80px rgba(0,0,0,0.5);
      display:block;
    }
    .lightbox-download{
      position:absolute; top:12px; right:12px;
      width:40px; height:40px; border-radius:50%;
      background:rgba(10,14,12,0.75);
      border:1px solid var(--line);
      color:var(--text);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:16px;
      transition:border-color .2s ease, color .2s ease, transform .2s ease;
      backdrop-filter:blur(6px);
    }
    .lightbox-download:hover{ border-color:var(--gold); color:var(--gold); transform:translateY(-1px); }

    .lightbox-caption{
      text-align:center;
      max-width:min(80vw, 640px);
      padding:0 12px;
    }
    .lightbox-caption .lightbox-title{
      font-family:var(--display); font-weight:700;
      font-size:22px; letter-spacing:0.01em;
      color:var(--text); margin-bottom:8px;
    }
    .lightbox-caption .lightbox-desc{
      font-family:var(--mono); font-size:13px; line-height:1.6;
      color:var(--text-dim);
    }
    @media (max-width:700px){
      .lightbox-caption .lightbox-title{ font-size:18px; }
      .lightbox-caption .lightbox-desc{ font-size:12px; line-height:1.55; }
      .lightbox-media img{ max-height:55vh; }
    }
    @media (max-width:420px){
      .lightbox-caption .lightbox-title{ font-size:16px; }
      .lightbox-caption .lightbox-desc{ font-size:11.5px; }
      .lightbox-download{ width:36px; height:36px; font-size:14px; }
    }

    /* ---- download confirm dialog ---- */
    .download-confirm-overlay{
      position:fixed; inset:0; z-index:220;
      background:rgba(10,14,12,0.6);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none;
      transition:opacity .25s ease;
    }
    .download-confirm-overlay.open{ opacity:1; pointer-events:auto; }
    .download-confirm-box{
      background:var(--bg); border:1px solid var(--line); border-radius:10px;
      padding:22px 26px; max-width:320px; text-align:center;
      font-family:var(--mono);
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
    }
    .download-confirm-box p{
      font-size:13px; color:var(--text); margin-bottom:18px; line-height:1.5;
    }
    .download-confirm-actions{
      display:flex; gap:12px; justify-content:center;
    }
    .download-confirm-actions button{
      font-family:var(--display); font-weight:600; font-size:13px;
      padding:9px 18px; border-radius:24px; cursor:pointer;
      border:1px solid var(--line); background:none; color:var(--text);
      transition:border-color .2s ease, color .2s ease, transform .2s ease;
    }
    .download-confirm-actions button:hover{ transform:translateY(-1px); }
    .download-confirm-actions .confirm-yes{
      background:linear-gradient(135deg, var(--gold), #e6bd77);
      color:var(--bg); border:none;
    }
    .download-confirm-actions .confirm-no:hover{ border-color:var(--gold); color:var(--gold); }
    /* Contact button (top-right) */
.contact-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 30px;
  padding: 10px 18px;
  color: #E9EFE8;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: 0.25s;
  backdrop-filter: blur(6px);
  background: rgba(18,24,20,0.3);
}
.contact-btn i {
  color: #C99B4A;
  font-size: 16px;
}
.contact-btn:hover {
  border-color: #C99B4A;
  background: rgba(201,155,74,0.08);
}

/* Contact + Blog stack (top-right) */
.topbar-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}
.blog-btn { text-decoration: none; }
@media (max-width: 520px) {
  .topbar-actions { gap: 8px; }
}

/* Popup overlay – hidden by default */
#contactOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999999;
  background: rgba(8,12,10,0.82);
  backdrop-filter: blur(12px);
  align-items: center;
  justify-content: center;
}
#contactOverlay.open {
  display: flex;
}

.contact-popup {
  position: relative;
  width: min(500px, 96vw);
  max-height: 90vh;
  background: transparent;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.contact-popup iframe {
  width: 100%;
  height: 480px;
  max-height: 80vh;
  border: none;
  display: block;
  background: transparent;
}

.close-contact {
  position: absolute;
  top: 14px;
  right: 18px;
  z-index: 10;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(8,12,10,0.7);
  color: #E9EFE8;
  font-size: 28px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.close-contact:hover {
  background: rgba(201,155,74,0.2);
  transform: rotate(90deg);
}
  </style>
  </head>
  <body>

  <video id="backgroundVideo" autoplay muted loop playsinline preload="auto" poster="background.jpg">
    <source src="Background Video Index.mp4" type="video/mp4">
  </video>

  <canvas id="bgCanvas"></canvas>

    <!-- Infinite Game Launcher -->
  <button id="infiniteGameLauncher" aria-label="Play Infinite">
        <span class="game-icon">∞</span>
        <span class="game-label">Infinite</span>
  </button>

    <div id="infiniteGameOverlay">
      <div class="infiniteGameWindow">

          <button id="closeInfiniteGame" aria-label="Close game">
              ×
          </button>

          <iframe
              src="infinite.html"
              title="Infinite Game">
          </iframe>

      </div>
  </div>

    <div class="topbar">
  <div class="name-block">
    <a class="name-link" href="portfolio.html">
      <span class="dot"></span>OMANSHU BHATT
    </a>
    <a class="cta" href="portfolio.html">View portfolio <span class="arrow">→</span></a>
  </div>

  <!-- 🔽 CONTACT + BLOG (right side, stacked) -->
  <div class="topbar-actions">
    <button id="contactBtn" class="contact-btn">
      <i class="fas fa-comment-dots"></i> Contact
    </button>
    <a id="blogBtn" class="contact-btn blog-btn" href="blog.html">
      <i class="fas fa-feather-pointed"></i> Blog
    </a>
  </div>
</div>

    <div class="mode-toggle">
      <button class="active" data-mode="rings">Rings</button>
      <button data-mode="spiral">Spiral</button>
    </div>

    <a id="globeLauncher" href="globe.html" aria-label="Open interactive globe">
      <span class="globe-icon"><span class="band"></span><span class="shade"></span></span>
      <span class="globe-label">Globe</span>
    </a>

    <div class="stage">

      <!-- ===================== CENTER EMBLEM =====================
          This stands in for K95's "road." Placeholder = topographic
          contour rings + your initials. Swap this whole .emblem block
          for whatever center visual you decide on later. -->
      

      <!-- ===================== ORBIT RING =====================
          8 image slots, evenly spaced (360° / 8 = 45° apart),
          orbiting the center continuously.

          TO ADD YOUR IMAGES:
          1. Put your image files in an /images folder next to this file.
          2. For each slot below, find the empty <div class="orbit-img">
              and put your image inside it, e.g.:
                <div class="orbit-img">
                  <img src="images/project1.jpg" alt="Describe this image">
                </div>
          3. Right now each slot shows a dashed placeholder box — that's
              just so you can see the layout. It disappears once you add
              a real <img> inside it.
          4. Want more or fewer than 8 images? Copy or delete whole
              <div class="orbit-item"> blocks, and adjust every --angle
              value so they're evenly spaced again (360 ÷ number of items).
      -->
      <div class="orbit-ring">

        <!-- SLOT 1 -->

    <script>
      /* ===================== 3D RING / SPIRAL ENGINE =====================
        Rings mode: your 8 images cloned into 3 stacked rings (top/mid/
        bottom), each rotating in true 3D depth (rotateY + translateZ) —
        front images appear larger/brighter, far-side images smaller/
        dimmer and pass behind, visible from the back too.
        Spiral mode: the original 8 images rise/fall in an infinite
        vertical helix, fading out at the very top/bottom and reappearing
        on the opposite side — a continuous loop, nothing just vanishes.
        Scroll (wheel/trackpad) spins everything; there's also a gentle
        idle drift when you're not scrolling.
      */
      const CONFIG = {
        idleSpeed: 0.20,
        scrollSensitivity: 0.045,
        damping: 0.92,
        spiralSpeed: 0.6,   // px/frame the spiral rises — independent of rotation
        spiralSpan: 520      // px — total vertical travel before wrapping
      };
      const mobileCompact = window.innerWidth <= 600;
      const mobileIdleBoost = mobileCompact ? 0.18 : 0;

      const stage = document.querySelector('.stage');
      const originalRing = document.querySelector('.orbit-ring');
      const originalItems = Array.from(originalRing.querySelectorAll('.orbit-item'));
      const N = originalItems.length;
      const radius = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--radius'));

      // Build the 3-tier structure for Rings mode by cloning the original
      // 8 slots — this means you only ever have to edit images in ONE
      // place (the original 8 slots in the HTML) and all 3 rings update.
      const TIERS = [
        { name:'top',    yOffset: mobileCompact ? -88 : -190, radiusScale: mobileCompact ? 0.68 : 0.8,  speedMul:1.15, opacityMul:0.85, el:null, items:null },
        { name:'mid',    yOffset:0,    radiusScale: mobileCompact ? 0.82 : 1,    speedMul:1,    opacityMul:1,    el:originalRing, items:originalItems },
        { name:'bottom', yOffset: mobileCompact ? 88 : 190, radiusScale: mobileCompact ? 0.68 : 0.8,  speedMul:0.85, opacityMul:0.85, el:null, items:null }
      ];
      TIERS.forEach(tier=>{
        if(tier.el) return; // mid tier already exists
        const clone = originalRing.cloneNode(true);
        clone.classList.add('orbit-ring-clone');
        stage.appendChild(clone);
        tier.el = clone;
        tier.items = Array.from(clone.querySelectorAll('.orbit-item'));
      });
      TIERS.forEach(tier=>{
        tier.el.style.zIndex = tier.name === 'top' ? 60 : tier.name === 'mid' ? 2 : 1;
      });

      let mode = 'rings';
      let rotation = 0;
      let scrollBoost = 0;
      let spiralPhase = 0;
      let paused = false;

      function tick(){
        if(!paused){
          rotation += CONFIG.idleSpeed + scrollBoost + mobileIdleBoost;
          spiralPhase += CONFIG.spiralSpeed + Math.abs(scrollBoost) * 4 + (mobileCompact ? 0.18 : 0);
          scrollBoost *= CONFIG.damping;
        }

        if(mode === 'rings'){
          TIERS.forEach(tier=>{
            tier.el.style.display = 'block';
            tier.items.forEach((item, i)=>{
              const angle = (360 / N) * i + rotation * tier.speedMul;
              const rad = angle * Math.PI / 180;
              item.style.transform =
                `translate(-50%,-50%) translateY(${tier.yOffset}px) rotateY(${angle}deg) translateZ(${radius * tier.radiusScale}px)`;
              const depthFactor = (Math.cos(rad) + 1) / 2; // 0 = back, 1 = front
              item.style.opacity = (0.35 + depthFactor * 0.65) * tier.opacityMul;
              item.style.zIndex = 10 + Math.round(depthFactor * 100);
            });
          });
        } else {
          // Spiral: hide the extra tiers, animate only the original 8
          // in an infinite vertical helix.
          TIERS.forEach(tier=>{ if(tier.name !== 'mid') tier.el.style.display = 'none'; });
          originalRing.style.display = 'block';
          const span = CONFIG.spiralSpan;
          originalItems.forEach((item, i)=>{
            const phase = (i / N) * span;
            let y = (((phase + spiralPhase) % span) + span) % span - span / 2;
            const angle = (360 / N) * i + rotation;
            const rad = angle * Math.PI / 180;
            item.style.transform =
              `translate(-50%,-50%) translateY(${y}px) rotateY(${angle}deg) translateZ(${radius * 0.8}px)`;
            const edgeFade = Math.min(1, (span / 2 - Math.abs(y)) / 70); // fades before wrapping — hides the seam
            const depthFactor = (Math.cos(rad) + 1) / 2;
            item.style.opacity = (0.3 + depthFactor * 0.7) * Math.max(0, edgeFade);
            item.style.zIndex = 10 + Math.round(depthFactor * 100);
          });
        }

        requestAnimationFrame(tick);
      }

      window.addEventListener('wheel', (e)=>{
        scrollBoost += e.deltaY * CONFIG.scrollSensitivity;
      }, { passive:true });

      document.querySelectorAll('.mode-toggle button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.mode-toggle button').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          mode = btn.dataset.mode;
        });
      });

      tick();

      /* ===================== LIGHTBOX =====================
        Uses event delegation so it works on the cloned tier images too. */
      const lightbox = document.getElementById('lightbox');
      const lightboxContent = document.getElementById('lightboxContent');
      const lightboxBack = document.getElementById('lightboxBack');
      const downloadConfirmOverlay = document.getElementById('downloadConfirmOverlay');
      const confirmDownloadYes = document.getElementById('confirmDownloadYes');
      const confirmDownloadNo = document.getElementById('confirmDownloadNo');
      let pendingDownloadUrl = '';
      let pendingDownloadName = 'image';

      function openLightbox(orbitImgEl){
        const realImg = orbitImgEl.querySelector('img');
        lightboxContent.innerHTML = '';
        if(realImg){
          // image + tap-to-reveal download icon
          const media = document.createElement('div');
          media.className = 'lightbox-media';

          const bigImg = document.createElement('img');
          bigImg.src = realImg.getAttribute('src');
          bigImg.alt = realImg.getAttribute('alt') || '';
          media.appendChild(bigImg);

          const dlBtn = document.createElement('button');
          dlBtn.className = 'lightbox-download';
          dlBtn.type = 'button';
          dlBtn.setAttribute('aria-label', 'Download image');
          dlBtn.innerHTML = '<i class="fa-solid fa-download"></i>';
          media.appendChild(dlBtn);

          dlBtn.addEventListener('click', (e)=>{
            e.stopPropagation();
            pendingDownloadUrl = bigImg.src;
            const rawName = realImg.dataset.title || realImg.getAttribute('alt') || 'image';
            pendingDownloadName = rawName.replace(/[^a-z0-9\- ]/gi, '').trim().replace(/\s+/g, '-').toLowerCase() || 'image';
            downloadConfirmOverlay.classList.add('open');
          });

          lightboxContent.appendChild(media);

          // heading + description below the image
          const title = realImg.dataset.title || '';
          const desc = realImg.dataset.desc || '';
          if(title || desc){
            const caption = document.createElement('div');
            caption.className = 'lightbox-caption';
            if(title){
              const h = document.createElement('div');
              h.className = 'lightbox-title';
              h.textContent = title;
              caption.appendChild(h);
            }
            if(desc){
              const p = document.createElement('div');
              p.className = 'lightbox-desc';
              p.textContent = desc;
              caption.appendChild(p);
            }
            lightboxContent.appendChild(caption);
          }
        } else {
          const label = orbitImgEl.querySelector('.placeholder-label');
          const box = document.createElement('div');
          box.className = 'lightbox-placeholder';
          box.textContent = label ? label.textContent + ' — add your image here' : 'Add your image here';
          lightboxContent.appendChild(box);
        }
        document.body.classList.add('lightbox-open');
        infiniteGameOverlay.classList.remove('active');
        lightbox.classList.add('open');
        paused = true;
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox(){
        lightbox.classList.remove('open');
        document.body.classList.remove('lightbox-open');
        downloadConfirmOverlay.classList.remove('open');
        paused = false;
        document.body.style.overflow = '';
      }

      document.addEventListener('click', (e)=>{
        const img = e.target.closest('.orbit-img');
        if(img){ openLightbox(img); }
      });

      lightboxBack.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeLightbox(); });
      document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });

      /* ---- download confirm: "yes" downloads the file, "no" cancels ---- */
      confirmDownloadYes.addEventListener('click', ()=>{
        if(pendingDownloadUrl){
          const a = document.createElement('a');
          a.href = pendingDownloadUrl;
          a.download = pendingDownloadName;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
        downloadConfirmOverlay.classList.remove('open');
      });
      confirmDownloadNo.addEventListener('click', ()=>{
        downloadConfirmOverlay.classList.remove('open');
      });
      downloadConfirmOverlay.addEventListener('click', (e)=>{
        if(e.target === downloadConfirmOverlay) downloadConfirmOverlay.classList.remove('open');
      });

    </script>

    <script>
      /* ===================== INTERACTIVE BACKGROUND =====================
        A quiet grid of points sits over your background image. While the
        cursor is still, nothing happens. Moving it displaces nearby
        points and shifts their color toward gold — it settles back once
        you stop. Skipped entirely if the OS has "reduce motion" on.
      */
      if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, points = [];
        const SPACING = 46;

        function buildGrid(){
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;
          points = [];
          for(let y = 0; y < H + SPACING; y += SPACING){
            for(let x = 0; x < W + SPACING; x += SPACING){
              points.push({ ox:x, oy:y, x, y, vx:0, vy:0, heat:0 });
            }
          }
        }
        buildGrid();
        window.addEventListener('resize', buildGrid);

        let mouse = { x:-9999, y:-9999, px:-9999, py:-9999, speed:0 };
        function updateMouse(x, y){
          mouse.speed = Math.min(60, Math.hypot(x - mouse.px, y - mouse.py));
          mouse.px = mouse.x; mouse.py = mouse.y;
          mouse.x = x; mouse.y = y;
        }
        window.addEventListener('mousemove', (e)=> updateMouse(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e)=>{
          if(e.touches[0]) updateMouse(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive:true });

        function drawBg(){
          ctx.clearRect(0, 0, W, H);
          const influenceRadius = 160;

          for(const p of points){
            const dx = p.ox - mouse.x;
            const dy = p.oy - mouse.y;
            const dist = Math.hypot(dx, dy);

            if(dist < influenceRadius){
              const force = (1 - dist / influenceRadius) * (6 + mouse.speed * 0.35);
              const angle = Math.atan2(dy, dx);
              p.vx += Math.cos(angle) * force * 0.06;
              p.vy += Math.sin(angle) * force * 0.06;
              p.heat = Math.min(1, p.heat + 0.08);
            } else {
              p.heat *= 0.94;
            }

            // spring back toward the origin point
            p.vx += (p.ox - p.x) * 0.02;
            p.vy += (p.oy - p.y) * 0.02;
            p.vx *= 0.85; p.vy *= 0.85;
            p.x += p.vx; p.y += p.vy;

            const r = 1.1 + p.heat * 1.8;
            const gold = [201, 155, 74], teal = [79, 166, 149];
            const c = p.heat > 0.02
              ? gold.map((g,i)=> Math.round(teal[i] + (g - teal[i]) * p.heat))
              : teal;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]}, ${0.06 + p.heat * 0.5})`;
            ctx.fill();
          }
          requestAnimationFrame(drawBg);
        }
        drawBg();
      }
    </script>

  });

  closeInfiniteGame.addEventListener("click", () => {
      document.querySelector('#infiniteGameOverlay iframe')?.contentWindow.postMessage({ type: 'stop-infinite-game' }, '*');
      infiniteGameOverlay.classList.remove("active");
  });

    function closeInfiniteGameOverlay() {
      document.querySelector('#infiniteGameOverlay iframe')?.contentWindow.postMessage({ type: 'stop-infinite-game' }, '*');
      infiniteGameOverlay.classList.remove("active");
    }

  /* Close by clicking outside the game */

    infiniteGameOverlay.addEventListener("click", (event) => {

      if (event.target === infiniteGameOverlay) {
        closeInfiniteGameOverlay();
      }

  });

  /* ESC key */

  document.addEventListener("keydown", (event) => {

      if (event.key === "Escape") {
          closeInfiniteGameOverlay();
      }

  });
  </script>
  <!-- =========================================================
      ISOLATED GESTURE BACKGROUND
      DOES NOT TOUCH ORBIT / IMAGES / LAYOUT
      ========================================================= -->

  <canvas id="gestureCanvas"></canvas>

  <style>
  #gestureCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;

      pointer-events: none;

      background: transparent;
  }
  </style>

  <script>
  (() => {

      const canvas = document.getElementById("gestureCanvas");

      if (!canvas) return;

      const ctx = canvas.getContext("2d");

      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      /* ---------------------------------------------------------
        POINTER
        --------------------------------------------------------- */

      const pointer = {
          x: -1000,
          y: -1000,
          lastX: -1000,
          lastY: -1000,
          active: false,
          speed: 0
      };


      /* ---------------------------------------------------------
        PARTICLES
        --------------------------------------------------------- */

      let particles = [];

      const PARTICLE_COUNT =
          window.innerWidth < 700 ? 45 : 100;

      const CONNECTION_DISTANCE = 130;


      class Particle {

          constructor() {

              this.x =
                  Math.random() * width;

              this.y =
                  Math.random() * height;

              this.baseX = this.x;
              this.baseY = this.y;

              this.vx =
                  (Math.random() - 0.5) * 0.25;

              this.vy =
                  (Math.random() - 0.5) * 0.25;

              this.size =
                  0.7 +
                  Math.random() * 1.4;

              this.phase =
                  Math.random() * Math.PI * 2;
          }


          update() {

              /*
              * Very subtle natural movement
              */

              this.vx +=
                  Math.sin(
                      performance.now() * 0.0005 +
                      this.phase
                  ) * 0.0004;

              this.vy +=
                  Math.cos(
                      performance.now() * 0.0004 +
                      this.phase
                  ) * 0.0004;


              /*
              * CURSOR GESTURE
              *
              * Only particles respond.
              * Nothing else on your website is touched.
              */

              if (pointer.active) {

                  const dx =
                      pointer.x - this.x;

                  const dy =
                      pointer.y - this.y;

                  const distance =
                      Math.sqrt(
                          dx * dx +
                          dy * dy
                      );

                  const radius = 190;


                  if (
                      distance < radius &&
                      distance > 1
                  ) {

                      const strength =
                          1 -
                          distance / radius;

                      /*
                      * Cursor pushes particles outward
                      */

                      this.vx -=
                          (dx / distance) *
                          strength *
                          0.035;

                      this.vy -=
                          (dy / distance) *
                          strength *
                          0.035;


                      /*
                      * Movement direction
                      * creates a flowing gesture
                      */

                      this.vx +=
                          (pointer.x - pointer.lastX) *
                          strength *
                          0.008;

                      this.vy +=
                          (pointer.y - pointer.lastY) *
                          strength *
                          0.008;
                  }
              }


              /*
              * Return slowly to calm movement
              */

              this.vx *= 0.94;
              this.vy *= 0.94;

              this.x += this.vx;
              this.y += this.vy;


              /*
              * Screen wrapping
              */

              if (this.x < -20)
                  this.x = width + 20;

              if (this.x > width + 20)
                  this.x = -20;

              if (this.y < -20)
                  this.y = height + 20;

              if (this.y > height + 20)
                  this.y = -20;
          }


          draw() {

              let opacity = 0.22;

              if (pointer.active) {

                  const distance =
                      Math.hypot(
                          pointer.x - this.x,
                          pointer.y - this.y
                      );

                  if (distance < 190) {

                      opacity =
                          0.22 +
                          (1 - distance / 190) *
                          0.5;
                  }
              }


              ctx.beginPath();

              ctx.arc(
                  this.x,
                  this.y,
                  this.size,
                  0,
                  Math.PI * 2
              );

              ctx.fillStyle =
                  `rgba(79,166,149,${opacity})`;

              ctx.fill();
          }
      }


      /* ---------------------------------------------------------
        RESIZE
        --------------------------------------------------------- */

      function resize() {

          width =
              window.innerWidth;

          height =
              window.innerHeight;

          dpr =
              Math.min(
                  window.devicePixelRatio || 1,
                  2
              );

          canvas.width =
              width * dpr;

          canvas.height =
              height * dpr;

          canvas.style.width =
              width + "px";

          canvas.style.height =
              height + "px";

          ctx.setTransform(
              dpr,
              0,
              0,
              dpr,
              0,
              0
          );


          particles = [];

          const count =
              width < 700 ? 45 : 100;

          for (
              let i = 0;
              i < count;
              i++
          ) {

              particles.push(
                  new Particle()
              );
          }
      }


      /* ---------------------------------------------------------
        CONNECTIONS
        --------------------------------------------------------- */

      function drawConnections() {

          for (
              let i = 0;
              i < particles.length;
              i++
          ) {

              for (
                  let j = i + 1;
                  j < particles.length;
                  j++
              ) {

                  const a =
                      particles[i];

                  const b =
                      particles[j];

                  const distance =
                      Math.hypot(
                          a.x - b.x,
                          a.y - b.y
                      );


                  if (
                      distance <
                      CONNECTION_DISTANCE
                  ) {

                      let opacity =
                          1 -
                          distance /
                          CONNECTION_DISTANCE;


                      /*
                      * Make the network stronger
                      * around the cursor.
                      */

                      if (pointer.active) {

                          const da =
                              Math.hypot(
                                  pointer.x - a.x,
                                  pointer.y - a.y
                              );

                          const db =
                              Math.hypot(
                                  pointer.x - b.x,
                                  pointer.y - b.y
                              );

                          const influence =
                              Math.max(
                                  0,
                                  1 -
                                  Math.min(da, db) /
                                  200
                              );

                          opacity +=
                              influence * 0.35;
                      }


                      opacity =
                          Math.min(
                              opacity,
                              0.35
                          );


                      ctx.beginPath();

                      ctx.moveTo(
                          a.x,
                          a.y
                      );

                      ctx.lineTo(
                          b.x,
                          b.y
                      );

                      ctx.strokeStyle =
                          `rgba(79,166,149,${opacity * 0.45})`;

                      ctx.lineWidth = 0.6;

                      ctx.stroke();
                  }
              }
          }
      }


      /* ---------------------------------------------------------
        CURSOR GLOW
        --------------------------------------------------------- */

      function drawCursorGlow() {

          if (!pointer.active)
              return;


          const gradient =
              ctx.createRadialGradient(
                  pointer.x,
                  pointer.y,
                  0,
                  pointer.x,
                  pointer.y,
                  190
              );


          gradient.addColorStop(
              0,
              "rgba(201,155,74,0.10)"
          );

          gradient.addColorStop(
              0.35,
              "rgba(79,166,149,0.045)"
          );

          gradient.addColorStop(
              1,
              "rgba(79,166,149,0)"
          );


          ctx.fillStyle =
              gradient;


          ctx.beginPath();

          ctx.arc(
              pointer.x,
              pointer.y,
              190,
              0,
              Math.PI * 2
          );

          ctx.fill();
      }


      /* ---------------------------------------------------------
        ANIMATION
        --------------------------------------------------------- */

      function animate() {

          ctx.clearRect(
              0,
              0,
              width,
              height
          );


          drawCursorGlow();


          for (
              const particle of particles
          ) {

              particle.update();
          }


          drawConnections();


          for (
              const particle of particles
          ) {

              particle.draw();
          }


          /*
          * Update pointer history
          */

          pointer.lastX +=
              (
                  pointer.x -
                  pointer.lastX
              ) * 0.15;

          pointer.lastY +=
              (
                  pointer.y -
                  pointer.lastY
              ) * 0.15;


          pointer.speed *= 0.9;


          requestAnimationFrame(
              animate
          );
      }


      /* ---------------------------------------------------------
        MOUSE
        --------------------------------------------------------- */

      window.addEventListener(
          "mousemove",
          (e) => {

              const dx =
                  e.clientX -
                  pointer.x;

              const dy =
                  e.clientY -
                  pointer.y;


              pointer.speed =
                  Math.min(
                      Math.hypot(dx, dy),
                      50
                  );


              pointer.lastX =
                  pointer.x;

              pointer.lastY =
                  pointer.y;

              pointer.x =
                  e.clientX;

              pointer.y =
                  e.clientY;

              pointer.active =
                  true;
          }
      );


      window.addEventListener(
          "mouseleave",
          () => {

              pointer.active =
                  false;
          }
      );


      /* ---------------------------------------------------------
        TOUCH / GESTURE
        --------------------------------------------------------- */

      window.addEventListener(
          "touchstart",
          (e) => {

              const touch =
                  e.touches[0];

              if (!touch) return;


              pointer.x =
                  touch.clientX;

              pointer.y =
                  touch.clientY;

              pointer.lastX =
                  pointer.x;

              pointer.lastY =
                  pointer.y;

              pointer.active =
                  true;
          },
          { passive: true }
      );


      window.addEventListener(
          "touchmove",
          (e) => {

              const touch =
                  e.touches[0];

              if (!touch) return;


              pointer.lastX =
                  pointer.x;

              pointer.lastY =
                  pointer.y;


              pointer.x =
                  touch.clientX;

              pointer.y =
                  touch.clientY;


              pointer.active =
                  true;
          },
          { passive: true }
      );


      window.addEventListener(
          "touchend",
          () => {

              pointer.active =
                  false;
          },
          { passive: true }
      );


      /* ---------------------------------------------------------
        START
        --------------------------------------------------------- */

      window.addEventListener(
          "resize",
          resize
      );

      resize();
      animate();

  })();
  </script>
